<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZiyoAI Enterprise Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#131314',
                        sidebarBg: '#1e1f20',
                        chatBg: '#18181a',
                        inputBg: '#282a2c',
                        accentGreen: '#00a67e'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-sidebarBg flex flex-col justify-between border-r border-gray-800 hidden md:flex">
        <div class="p-4 flex flex-col gap-4">
            <button onclick="createNewChat()" class="flex items-center gap-3 bg-accentGreen hover:bg-emerald-600 text-white px-4 py-3 rounded-xl font-medium transition shadow-lg">
                <i class="fa-solid fa-plus"></i> Yangi suhbat
            </button>
            <div id="chatHistoryList" class="flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-200px)] pr-1">
                <!-- Suhbatlar tarixi bu yerga tushadi -->
            </div>
        </div>
        <div class="p-4 border-t border-gray-800 flex flex-col gap-3">
            <div class="flex items-center justify-between text-sm text-gray-400">
                <span>Balans:</span>
                <span id="userBalance" class="text-emerald-400 font-bold">1000 so'rov</span>
            </div>
            <button onclick="openCabinet()" class="flex items-center gap-2 text-sm bg-gray-800 hover:bg-gray-700 p-2.5 rounded-lg transition text-gray-300">
                <i class="fa-solid fa-key text-accentGreen"></i> Kabinet & API Kalit
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-chatBg relative">
        <!-- Header -->
        <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-sidebarBg/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <span class="font-bold text-lg text-emerald-400"><i class="fa-solid fa-brain"></i> ZiyoAI Pro</span>
                <select id="aiMode" class="bg-inputBg border border-gray-700 text-xs text-gray-300 rounded-lg px-2.5 py-1.5 outline-none">
                    <option value="standard">Standard AI</option>
                    <option value="deep_research">Deep Research</option>
                    <option value="coding">Coding & Sandbox</option>
                    <option value="rag">RAG (Fayllar bilan ishlash)</option>
                </select>
            </div>
            <label class="cursor-pointer text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg transition flex items-center gap-2 text-gray-300">
                <i class="fa-solid fa-upload text-emerald-400"></i> Galereya / Fayl
                <input type="file" id="fileUpload" class="hidden" onchange="uploadFile()">
            </label>
        </header>

        <!-- Messages Box -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6 max-w-4xl w-full mx-auto">
            <div class="flex gap-4 items-start">
                <div class="w-8 h-8 rounded-full bg-accentGreen flex items-center justify-center text-white font-bold shrink-0">Z</div>
                <div class="bg-inputBg p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed border border-gray-800 shadow-sm">
                    Assalomu alaykum! Men ZiyoAI Enterprise assistentiman. Barcha funksiyalar (Real-time Streaming, Sandbox, RAG, Balans) tayyor. Savolingizni yozing!
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-darkBg border-t border-gray-800">
            <div class="max-w-4xl mx-auto relative flex items-center bg-inputBg rounded-2xl border border-gray-700 focus-within:border-emerald-500 transition shadow-inner">
                <textarea id="promptInput" rows="1" placeholder="ZiyoAI'ga xabar yozing yoki kod kiriting..." class="w-full bg-transparent p-4 pr-24 text-sm text-gray-100 resize-none outline-none max-h-32" onkeydown="handleEnter(event)"></textarea>
                
                <div class="absolute right-3 flex items-center gap-2">
                    <button onclick="toggleVoice()" id="voiceBtn" class="text-gray-400 hover:text-white p-2 rounded-lg transition" title="Ovozli rejim">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-white w-9 h-9 rounded-xl flex items-center justify-center transition shadow-md">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
            <div class="text-center text-[10px] text-gray-500 mt-2">ZiyoAI xatolikka yo'l qo'yishi mumkin. Muhim ma'lumotlarni tekshiring.</div>
        </div>
    </main>

    <script>
        const userId = "user_" + Math.random().toString(36.substring(2, 9));
        let ws = null;
        let isRecording = false;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${userId}`);
            
            ws.onmessage = function(event) {
                if (event.data === "[DONE]") {
                    currentAiBubble = null;
                    return;
                }
                if (!currentAiBubble) {
                    currentAiBubble = appendMessage("ZiyoAI", "", "ai");
                }
                currentAiBubble.innerText += event.data;
                scrollToBottom();
            };
        }

        let currentAiBubble = null;

        function appendMessage(sender, text, type) {
            const chatBox = document.getElementById("chatMessages");
            const wrapper = document.createElement("div");
            wrapper.className = `flex gap-4 items-start ${type === 'user' ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement("div");
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-white font-bold shrink-0 ${type === 'user' ? 'bg-indigo-600' : 'bg-accentGreen'}`;
            avatar.innerText = type === 'user' ? 'S' : 'Z';

            const bubble = document.createElement("div");
            bubble.className = `p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed border shadow-sm ${type === 'user' ? 'bg-indigo-900/40 border-indigo-800 text-white' : 'bg-inputBg border-gray-800 text-gray-200'}`;
            bubble.innerText = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            scrollToBottom();
            return bubble;
        }

        function sendMessage() {
            const input = document.getElementById("promptInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage("Siz", text, "user");
            input.value = "";

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            const box = document.getElementById("chatMessages");
            box.scrollTop = box.scrollHeight;
        }

        function toggleVoice() {
            isRecording = !isRecording;
            const btn = document.getElementById("voiceBtn");
            if (isRecording) {
                btn.classList.add("text-red-500", "animate-pulse");
                alert("Ovozli yozuv rejimi yoqildi (ChatGPT Style Voice simulyatsiyasi).");
            } else {
                btn.classList.remove("text-red-500", "animate-pulse");
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById("fileUpload");
            if (fileInput.files.length === 0) return;
            const formData = new FormData();
            formData.append("user_id", userId);
            formData.append("file", fileInput.files[0]);

            const res = await fetch("/api/rag/upload", { method: "POST", body: formData });
            const data = await res.json();
            alert(data.message);
        }

        function createNewChat() {
            document.getElementById("chatMessages").innerHTML = '';
            appendMessage("ZiyoAI", "Yangi suhbat boshlandi. Qanday yordam bera olaman?", "ai");
        }

        async function openCabinet() {
            const res = await fetch(`/api/user/${userId}`);
            const data = await res.json();
            alert(`Foydalanuvchi: ${data.username}\nBalans: ${data.balance} so'rov\nAPI Kalit: ${data.api_key}`);
        }

        connectWebSocket();
    </script>
</body>
</html>
